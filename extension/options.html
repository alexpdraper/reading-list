<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reading List Options</title>
    <style>
        :root {
            --base-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            --base-font-size: 14px;
            --base-line-height: 1.4;
        }

        body {
            padding: 0;
            margin: 0;
            font-family: var(--base-font);
            font-size: var(--base-font-size);
            line-height: var(--base-line-height);
            background: #f5f5f5;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #181a20;
                color: #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <reading-list-options></reading-list-options>
    <script type="module" src="./reading-list-options.js"></script>
</body>
</html>
